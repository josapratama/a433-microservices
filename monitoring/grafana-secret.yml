# =============================================================
# grafana-secret.yml
# Deskripsi: Secret untuk kredensial admin Grafana.
#
# Secret ini menyimpan username dan password default untuk
# login ke dashboard Grafana.
#
# Cara encode ke base64:
#   echo -n "admin" | base64  -> YWRtaW4=
# =============================================================

apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: monitoring
  labels:
    app: grafana
type: Opaque
data:
  # Username admin Grafana (nilai asli: "admin")
  GF_SECURITY_ADMIN_USER: YWRtaW4=

  # Password admin Grafana (nilai asli: "admin")
  # PENTING: Ganti dengan password yang lebih kuat untuk production
  GF_SECURITY_ADMIN_PASSWORD: YWRtaW4=
