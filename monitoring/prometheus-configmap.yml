# =============================================================
# prometheus-configmap.yml
# Deskripsi: ConfigMap untuk konfigurasi Prometheus.
#
# Prometheus adalah sistem monitoring dan alerting open-source.
# File konfigurasi prometheus.yml mendefinisikan:
#   - global: pengaturan default seperti interval scrape
#   - scrape_configs: target yang akan di-monitor oleh Prometheus
#
# Prometheus akan scrape (mengumpulkan) metrics dari:
#   1. Prometheus itu sendiri (self-monitoring)
#   2. Pod Kubernetes yang memiliki annotation prometheus.io/scrape: "true"
# =============================================================

apiVersion: v1
kind: ConfigMap
metadata:
  # Nama ConfigMap yang akan direferensikan di Prometheus Deployment
  name: prometheus-config
  namespace: monitoring
  labels:
    app: prometheus
data:
  # File konfigurasi utama Prometheus
  prometheus.yml: |
    global:
      # Interval default untuk mengumpulkan metrics dari semua target
      scrape_interval: 15s
      # Interval untuk mengevaluasi aturan alerting
      evaluation_interval: 15s

    scrape_configs:
      # Job 1: Prometheus memonitor dirinya sendiri (self-monitoring)
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Job 2: Scrape metrics dari semua Pod di namespace default
      # Hanya Pod dengan annotation prometheus.io/scrape: "true" yang di-scrape
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          # Menggunakan Kubernetes Service Discovery untuk menemukan Pod
          - role: pod
            namespaces:
              names:
                - default
        relabel_configs:
          # Hanya scrape Pod yang memiliki annotation prometheus.io/scrape: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          # Ambil path metrics dari annotation (default: /metrics)
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          # Ambil port metrics dari annotation
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          # Tambahkan label namespace dari metadata Pod
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          # Tambahkan label nama Pod dari metadata
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

      # Job 3: Scrape metrics dari Node (CPU, memory, disk)
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
