# =============================================================
# karsajobs-ui-deployment.yml
# Deskripsi: Deployment untuk frontend Karsa Jobs (Vue.js).
#
# Frontend adalah aplikasi Vue.js yang berjalan di browser
# pengguna dan berkomunikasi langsung dengan backend API
# menggunakan URL yang dikonfigurasi via environment variable
# VUE_APP_BACKEND.
#
# PENTING: Nilai VUE_APP_BACKEND harus diisi dengan Node IP
# dan NodePort dari backend service sesuai lingkungan lokal.
# Jalankan "minikube ip" untuk mendapatkan Node IP.
# =============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  # Nama Deployment frontend
  name: karsajobs-ui
  namespace: default
  labels:
    app: karsajobs-ui
spec:
  # Jumlah replika Pod frontend yang dijalankan
  replicas: 1

  # Selector untuk memilih Pod yang dikelola Deployment ini
  selector:
    matchLabels:
      app: karsajobs-ui

  template:
    metadata:
      # Label pada Pod harus sesuai dengan selector di atas
      labels:
        app: karsajobs-ui
    spec:
      containers:
        - name: karsajobs-ui
          # Image dari GitHub Container Registry
          # Ganti dengan image yang sudah di-push menggunakan build script
          image: ghcr.io/josapratama/karsajobs-ui:latest

          # imagePullPolicy Always memastikan selalu pull image terbaru
          imagePullPolicy: Always

          ports:
            # Port yang diekspos oleh frontend Vue.js
            - containerPort: 8000

          # Environment variable untuk konfigurasi URL backend API
          env:
            # VUE_APP_BACKEND: URL lengkap untuk mengakses backend API
            # Format: http://<Node_IP>:<NodePort>
            # - Node_IP  : hasil dari perintah "minikube ip"
            # - NodePort : nodePort yang ditentukan di karsajobs-service.yml (30080)
            # Contoh: http://192.168.49.2:30080
            - name: VUE_APP_BACKEND
              value: "http://192.168.49.2:30080"

          # Resource limits untuk manajemen resource container
          resources:
            requests:
              memory: "64Mi"    # Minimal memory yang dijamin tersedia
              cpu: "100m"       # Minimal CPU yang dijamin tersedia
            limits:
              memory: "256Mi"   # Maksimal memory yang boleh digunakan
              cpu: "300m"       # Maksimal CPU yang boleh digunakan

          # Readiness probe: cek apakah container siap menerima traffic
          readinessProbe:
            httpGet:
              path: /         # Halaman utama frontend
              port: 8000
            initialDelaySeconds: 15   # Tunggu 15 detik sebelum mulai cek
            periodSeconds: 10         # Cek setiap 10 detik
