# =============================================================
# mongo-secret.yml
# Deskripsi: Secret untuk menyimpan kredensial MongoDB.
#
# Secret adalah objek Kubernetes yang digunakan untuk menyimpan
# data sensitif seperti password, token, atau kunci SSH.
# Data di dalam Secret disimpan dalam format base64-encoded.
#
# PENTING: Base64 bukan enkripsi! Gunakan solusi seperti
# Sealed Secrets atau Vault untuk production environment.
#
# Cara encode ke base64:
#   echo -n "admin" | base64              -> YWRtaW4=
#   echo -n "supersecretpassword" | base64 -> c3VwZXJzZWNyZXRwYXNzd29yZA==
# =============================================================

apiVersion: v1
kind: Secret
metadata:
  # Nama Secret yang akan direferensikan di StatefulSet dan Deployment
  name: mongo-secret
  namespace: default
  labels:
    app: mongodb
# Opaque adalah tipe Secret default untuk data arbitrer
type: Opaque
data:
  # Username root MongoDB dalam format base64
  # Nilai asli: "admin"
  MONGO_ROOT_USERNAME: YWRtaW4=

  # Password root MongoDB dalam format base64
  # Nilai asli: "supersecretpassword"
  MONGO_ROOT_PASSWORD: c3VwZXJzZWNyZXRwYXNzd29yZA==
