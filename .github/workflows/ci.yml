# =============================================================
# ci.yml - GitHub Actions CI untuk branch karsajobs-ui (frontend)
# Deskripsi: Pipeline CI otomatis yang berjalan setiap kali
#            ada push atau pull request ke branch karsajobs-ui.
#
# Pipeline ini memiliki 2 job yang berjalan secara berurutan:
#   1. lint-dockerfile       : Validasi kualitas Dockerfile
#   2. build-app-karsajobs-ui: Build dan push image ke GHCR
#
# Secrets yang diperlukan (set di GitHub > Settings > Secrets):
#   - GHCR_TOKEN : GitHub Personal Access Token dengan scope
#                  write:packages untuk push ke GHCR
# =============================================================

name: CI - Karsajobs UI Frontend

# Trigger: pipeline berjalan saat ada push atau pull request ke branch karsajobs-ui
on:
  push:
    branches:
      - karsajobs-ui
  pull_request:
    branches:
      - karsajobs-ui

jobs:
  # ===========================================================
  # Job 1: lint-dockerfile
  # Menjalankan hadolint untuk memvalidasi best practices
  # pada Dockerfile frontend. Hadolint adalah linter populer
  # untuk Dockerfile yang berbasis ShellCheck.
  # ===========================================================
  lint-dockerfile:
    name: Lint Dockerfile
    # Runner yang digunakan: Ubuntu terbaru (hosted by GitHub)
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout kode dari repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install hadolint
      # Download binary hadolint langsung dari GitHub releases
      # dan berikan permission execute
      - name: Install hadolint
        run: |
          # Download hadolint binary versi terbaru untuk Linux AMD64
          wget -O /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          # Berikan permission execute pada binary hadolint
          chmod +x /usr/local/bin/hadolint

      # Step 3: Jalankan hadolint pada Dockerfile frontend
      # Jika ada pelanggaran aturan, step ini akan gagal
      - name: Run hadolint on Dockerfile
        run: |
          echo ">>> Menjalankan hadolint pada Dockerfile..."
          hadolint Dockerfile
          echo ">>> Dockerfile linting selesai tanpa error."

  # ===========================================================
  # Job 2: build-app-karsajobs-ui
  # Build Docker image dari Dockerfile dan push ke GHCR.
  # Job ini hanya berjalan setelah lint-dockerfile berhasil.
  # ===========================================================
  build-app-karsajobs-ui:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    # Job ini hanya berjalan jika lint-dockerfile berhasil
    needs: lint-dockerfile
    # Hanya build dan push saat push ke branch karsajobs-ui (bukan PR)
    if: github.event_name == 'push'

    steps:
      # Step 1: Checkout kode dari repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Docker Buildx
      # Buildx mendukung multi-platform build dan fitur build cache
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Login ke GitHub Container Registry (GHCR)
      # Menggunakan GHCR_TOKEN dari GitHub Secrets untuk autentikasi
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # Username GitHub yang menjalankan workflow
          username: ${{ github.actor }}
          # Token GitHub dengan izin write:packages untuk push ke GHCR
          password: ${{ secrets.GHCR_TOKEN }}

      # Step 4: Build dan push Docker image ke GHCR
      # Image akan di-tag dengan "latest" dan SHA commit saat ini
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          # Konteks build adalah direktori root repository
          context: .
          # Aktifkan push ke registry
          push: true
          # Tag image: latest dan SHA commit (untuk traceability)
          tags: |
            ghcr.io/josapratama/karsajobs-ui:latest
            ghcr.io/josapratama/karsajobs-ui:${{ github.sha }}
          # Cache layer Docker dari GitHub Actions cache untuk mempercepat build
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 5: Tampilkan informasi image yang berhasil di-push
      - name: Image pushed successfully
        run: |
          echo ">>> Image berhasil di-push ke GHCR!"
          echo ">>> ghcr.io/josapratama/karsajobs-ui:latest"
          echo ">>> ghcr.io/josapratama/karsajobs-ui:${{ github.sha }}"
